<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meetgeon Mobile</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- Script Móvil -->
    <script src="js/mobile.js" defer></script>

    <style>
      body {
        background-color: #121212;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #remoteVideo {
        width: 100%;
        max-width: 450px;
        border-radius: 12px;
        background-color: #000;
      }
      .controls-bar {
        display: none; /* Se activa tras conectarse */
        gap: 15px;
        margin-top: 15px;
      }
    </style>
  </head>
  <body class="text-center p-3">
    <div class="container d-flex flex-column align-items-center">
      <h3 id="status" class="mb-3">Listo para unirte a la reunión</h3>
      <p id="sub-status" class="text-secondary">
        Presiona el botón para dar permisos e iniciar el video.
      </p>

      <!-- Botón para iniciar llamada -->
      <button id="startBtn" class="btn btn-primary btn-lg my-3">
        <i class="bi bi-telephone-fill me-2"></i> Unirse a la llamada
      </button>

      <div class="mt-2 w-100 d-flex justify-content-center">
        <video id="remoteVideo" autoplay playsinline></video>
      </div>

      <!-- Botones de Control para Móvil -->
      <div id="controlsBar" class="controls-bar">
        <button id="mobileMicBtn" class="btn btn-secondary rounded-circle p-3">
          <i class="bi bi-mic-fill fs-4"></i>
        </button>
        <button id="mobileCamBtn" class="btn btn-secondary rounded-circle p-3">
          <i class="bi bi-camera-video-fill fs-4"></i>
        </button>
        <button id="mobileHangupBtn" class="btn btn-danger rounded-circle p-3">
          <i class="bi bi-telephone-x-fill fs-4"></i>
        </button>
      </div>
    </div>
  </body>
</html>
